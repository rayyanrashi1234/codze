name: Build Aegis-X APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3 python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev
        sudo apt-get install -y libgstreamer1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libncursesw5-dev libreadline-dev tk-dev libffi-dev
        pip install --upgrade pip buildozer Cython==0.29.33 virtualenv
        
    - name: Initialize Buildozer
      run: |
        buildozer init
        
    - name: Configure Buildozer Spec
      run: |
        # Add requirements and permissions automatically
        sed -i 's/requirements = kivy/requirements = python3,kivy,requests,plyer,urllib3,charset_normalizer,idna,certifi/' buildozer.spec
        echo "android.permissions = INTERNET,ACCESS_NETWORK_STATE,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,MANAGE_EXTERNAL_STORAGE" >> buildozer.spec
        echo "android.accept_sdk_license = True" >> buildozer.spec
        echo "android.api = 33" >> buildozer.spec
        echo "android.minapi = 21" >> buildozer.spec
        
    - name: Build APK
      run: |
        yes | buildozer -v android debug
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: AegisX-Release
        path: bin/*.apk
